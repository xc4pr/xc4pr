<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 24" width="840" height="24" role="img" aria-label="divider">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}
.s{opacity:0;animation:run 6s linear infinite}@keyframes run{0%{opacity:0;transform:translateX(0)}6%{opacity:1}50%{opacity:1;transform:translateX(780px)}56%{opacity:0;transform:translateX(840px)}100%{opacity:0;transform:translateX(840px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="800" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="sp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".75" stop-color="#00f0ff"/><stop offset="1" stop-color="#e6f7ff"/></linearGradient>
<linearGradient id="df" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<clipPath id="cl"><rect x="40" y="0" width="760" height="24"/></clipPath>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g stroke="url(#ln)" stroke-width="2" stroke-linecap="round" opacity=".5"><line x1="40" y1="12" x2="406" y2="12"/><line x1="434" y1="12" x2="800" y2="12"/></g>
<g clip-path="url(#cl)"><rect class="s" x="-60" y="10.5" width="120" height="3" rx="1.5" fill="url(#sp)" filter="url(#glow)"/></g>
<path d="M420 4 L428 12 L420 20 L412 12 Z" fill="none" stroke="url(#df)" stroke-width="1.8" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M420 8.5 L423.5 12 L420 15.5 L416.5 12 Z" fill="#00f0ff" opacity=".7"/>
</svg>
