<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 306" width="840" height="306" role="img" aria-label="lab, not public yet: voice-copilot, a voice-first AI co-pilot for Linux with speech in, speech out, that drives the whole system, not just the desktop and the browser.">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}
.b{font-size:22px;fill:#111428}
.s{font-size:16px;fill:#4f5878}
.d{font-size:20px;fill:#4f5878}
.c{fill:#007f9c}
.m{fill:#b0128c}
.ok{fill:#0a8f5a}
.w{font-weight:700}
@keyframes blink{50%{opacity:0}}
.cur{fill:#007f9c;animation:blink 1.1s steps(1) infinite}
.n{font-size:28px;letter-spacing:.02em}
.pu{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#007f9c"/><stop offset="1" stop-color="#b0128c"/></linearGradient>
<clipPath id="clip"><rect x="10" y="10" width="820" height="286" rx="16"/></clipPath>
<filter id="haze" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="35"/></filter>
<filter id="lift" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dy="2" stdDeviation="4" flood-color="#1b2550" flood-opacity=".10"/></filter>
</defs>
<rect x="10" y="10" width="820" height="286" rx="16" fill="#fbfcff" fill-opacity="1" filter="url(#lift)"/>
<g clip-path="url(#clip)" opacity=".14" filter="url(#haze)"><circle cx="108.39999999999999" cy="52.9" r="90" fill="#007f9c"/><circle cx="748.0" cy="281.7" r="100" fill="#b0128c"/></g>
<rect x="10" y="10" width="820" height="286" rx="16" fill="url(#glass)"/>
<rect x="10" y="10" width="820" height="286" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<line x1="26" y1="11.5" x2="814" y2="11.5" stroke="#fff" stroke-opacity=".9"/>
<text class="w c" font-size="22" x="44" y="62"><tspan class="m">&gt;</tspan> ls ~/lab</text>
<text class="d" x="796" y="62" text-anchor="end"># not public yet</text>
<g transform="translate(46,92)" fill="none" stroke="#007f9c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="4" width="14" height="24" rx="7"/><path d="M11 22 a13 13 0 0 0 26 0 M24 35 V44 M17 44 H31"/><path stroke="#b0128c" d="M3 18 V26 M8 14 V30 M40 14 V30 M45 18 V26"/></g>
<text class="w c n" x="124" y="122">voice-copilot/</text>
<g class="pu"><rect x="412" y="95" width="82" height="32" rx="16" fill="#b0128c" fill-opacity=".10" stroke="#b0128c" stroke-width="1.2"/><text class="m" x="453.0" y="117" font-size="18" text-anchor="middle">[wip]</text></g>
<g><rect x="504" y="95" width="127" height="32" rx="16" fill="#b0128c" fill-opacity=".10" stroke="#b0128c" stroke-width="1.2"/><text class="m" x="567.5" y="117" font-size="18" text-anchor="middle">[private]</text></g>
<text class="b" x="124" y="160">voice-first AI co-pilot for Linux: speech in,</text>
<text class="b" x="124" y="189">speech out, and it drives the whole system,</text>
<text class="b" x="124" y="218">not just the desktop and the browser.</text>
<text class="m" font-size="22" x="44" y="266">&gt;</text><rect class="cur" x="68" y="248" width="12" height="24"/>
</svg>
