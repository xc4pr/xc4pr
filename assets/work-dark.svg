<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 808" width="840" height="808" role="img" aria-label="What I do: AI x FINTECH. Implementation, fine-tuning and process automation in fintech and crypto. DATA ON AUTOPILOT. Data, reporting and compliance workflows that run without me. AGENTIC AI. Autonomous agents and coding-agent workflows: hooks, custom instructions, an Obsidian second brain. Some take orders via Telegram. SELF-HOSTED. Local-first Linux on Arch, running on my own hardware instead of someone else's cloud. LOCAL LLMs. Inference on AMD GPUs with ROCm and Ollama. AGENT SECURITY. Security reviews of AI agent tooling.">
