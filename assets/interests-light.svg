<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 734" width="840" height="734" role="img" aria-label="Interests: Local-first, your data, your device. System one models, Laya: typed decisions, not generated text. Data analysis: preparing, cleaning and analyzing data. Bitcoin, on-chain analytics. Forensics, blockchain forensics. Digital ID, verifiable credentials. Number theory, primes and patterns. Cyberpunk 3D, art and animation. Linux ricing, dotfiles over defaults. FOSS, free and open source. Cybersecurity, zero trust by default.">
