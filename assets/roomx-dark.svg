<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-label="roomx: interactive room planner. Measure your rooms, see them in 3D, furnish them. Runs in the browser, works offline, no account, your data stays on your device. SvelteKit, TypeScript, three.js.">
<style>
