.cur{fill:#00f0ff;animation:blink 1.1s steps(1) infinite}
.h{font-size:34px;letter-spacing:.04em}
.dr{animation:draw 1.8s ease-out backwards;animation-delay:var(--t,0s)}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.scan{opacity:0;animation:scan 5s linear 2s infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateY(206px);opacity:0}}
