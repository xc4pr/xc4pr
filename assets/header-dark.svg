<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="xc4pr, WHOAMI?">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}
.h{stroke:url(#gv);stroke-width:1.2;transform:translateY(var(--y));animation:slide 7s cubic-bezier(.5,0,1,.5) infinite,fade 7s linear infinite}@keyframes slide{0%{transform:translateY(0)}100%{transform:translateY(78px)}}@keyframes fade{0%{opacity:0}15%{opacity:.6}85%{opacity:1}100%{opacity:0}}.gc,.gm{opacity:0;transform-box:fill-box;animation:gl 4.4s steps(1,end) infinite}.gm{animation-name:gm}@keyframes gl{0%{opacity:0}74%{opacity:.9;clip-path:inset(12% 0 62% 0);transform:translate(-8px,0)}76.5%{clip-path:inset(58% 0 18% 0);transform:translate(5px,0)}79%{clip-path:inset(30% 0 45% 0);transform:translate(-4px,1px)}81.5%{clip-path:inset(72% 0 6% 0);transform:translate(7px,0)}84%{opacity:0}100%{opacity:0}}@keyframes gm{0%{opacity:0}74%{opacity:.9;clip-path:inset(48% 0 34% 0);transform:translate(8px,0)}76.5%{clip-path:inset(8% 0 74% 0);transform:translate(-5px,0)}79%{clip-path:inset(64% 0 14% 0);transform:translate(4px,-1px)}81.5%{clip-path:inset(24% 0 52% 0);transform:translate(-7px,0)}84%{opacity:0}100%{opacity:0}}.wm{animation:jit 4.4s steps(1,end) infinite}@keyframes jit{0%{transform:none}74%{transform:translateX(2px)}77%{transform:translateX(-2px)}80%{transform:translateX(1px)}83%{transform:none}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
