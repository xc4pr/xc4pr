<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="gv" gradientUnits="userSpaceOnUse" x1="0" y1="222" x2="0" y2="300"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/></linearGradient>
