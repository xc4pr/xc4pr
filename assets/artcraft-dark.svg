<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370" role="img" aria-label="upstream ArtCraft: patches for DeckCraft and GridCraft, clean-room office apps in pure Rust. DeckCraft: visible text caret on dark slides, Design Ideas fixes. GridCraft: Ctrl+click follows hyperlinks, Auto Fill Options after a drag.">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}
.b{font-size:22px;fill:#e6f7ff}
.s{font-size:16px;fill:#8b95b8}
.d{font-size:20px;fill:#8b95b8}
.c{fill:#00f0ff}
.m{fill:#ff2bd6}
.ok{fill:#39ff9f}
.w{font-weight:700}
@keyframes blink{50%{opacity:0}}
.cur{fill:#00f0ff;animation:blink 1.1s steps(1) infinite}
.h{font-size:34px;letter-spacing:.04em}
.r{animation:row .5s ease-out backwards;animation-delay:var(--t)}
@keyframes row{from{opacity:0;transform:translateX(-10px)}}
.cur{animation:show 2.6s steps(1),blink 1.1s steps(1) 2.6s infinite}
@keyframes show{0%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<clipPath id="clip"><rect x="10" y="10" width="820" height="350" rx="16"/></clipPath>
<filter id="haze" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="35"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="820" height="350" rx="16" fill="#0c0d1a" fill-opacity=".92"/>
<g clip-path="url(#clip)" opacity=".30" filter="url(#haze)"><circle cx="108.39999999999999" cy="62.5" r="90" fill="#00f0ff"/><circle cx="748.0" cy="342.5" r="100" fill="#ff2bd6"/></g>
<rect x="10" y="10" width="820" height="350" rx="16" fill="url(#glass)"/>
<rect x="10" y="10" width="820" height="350" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<line x1="26" y1="11.5" x2="814" y2="11.5" stroke="#fff" stroke-opacity=".25"/>
<text class="w h" x="44" y="68" style="fill:#8b95b8">upstream /</text>
<text class="w h c" x="282.4" y="68" filter="url(#glow)">ArtCraft</text>
<g><rect x="492" y="42" width="71" height="32" rx="16" fill="#ff2bd6" fill-opacity=".10" stroke="#ff2bd6" stroke-width="1.2"/><text class="m" x="527.5" y="64" font-size="18" text-anchor="middle">Rust</text></g>
<g><rect x="573" y="42" width="60" height="32" rx="16" fill="#ff2bd6" fill-opacity=".10" stroke="#ff2bd6" stroke-width="1.2"/><text class="m" x="603.0" y="64" font-size="18" text-anchor="middle">PRs</text></g>
<text class="b" x="44" y="114">Patches for DeckCraft and GridCraft,</text>
<text class="b" x="44" y="143">clean-room office apps in pure Rust.</text>
<rect x="38" y="168" width="764" height="170" rx="10" fill="#05060e" fill-opacity=".7" stroke="#00f0ff" stroke-opacity=".25"/>
<g class="r" style="--t:0.4s"><rect x="39" y="178" width="762" height="36" fill="#39ff9f" fill-opacity=".08"/><rect x="39" y="178" width="3" height="36" fill="#39ff9f"/><text class="b ok w" x="62" y="204">+</text><text class="b m" x="94" y="204">deckcraft</text><text class="b" x="242" y="204">visible text caret on dark slides</text></g>
<g class="r" style="--t:0.9s"><rect x="39" y="216" width="762" height="36" fill="#39ff9f" fill-opacity=".08"/><rect x="39" y="216" width="3" height="36" fill="#39ff9f"/><text class="b ok w" x="62" y="242">+</text><text class="b m" x="94" y="242">deckcraft</text><text class="b" x="242" y="242">Design Ideas fixes</text></g>
<g class="r" style="--t:1.4s"><rect x="39" y="254" width="762" height="36" fill="#39ff9f" fill-opacity=".08"/><rect x="39" y="254" width="3" height="36" fill="#39ff9f"/><text class="b ok w" x="62" y="280">+</text><text class="b m" x="94" y="280">gridcraft</text><text class="b" x="242" y="280">Ctrl+click follows hyperlinks</text></g>
<g class="r" style="--t:1.9s"><rect x="39" y="292" width="762" height="36" fill="#39ff9f" fill-opacity=".08"/><rect x="39" y="292" width="3" height="36" fill="#39ff9f"/><text class="b ok w" x="62" y="318">+</text><text class="b m" x="94" y="318">gridcraft</text><text class="b" x="242" y="318">Auto Fill Options after a drag</text></g>
<rect class="cur" x="659.2" y="298" width="12" height="24"/>
</svg>
