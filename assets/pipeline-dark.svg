<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 462" width="840" height="462" role="img" aria-label="How I work: 01 idea, spot the boring part. 02 automate, script it or hand it to an agent. 03 self-host, run it on my own boxes. 04 ship, push, use, repeat. Then repeat.">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}
.t{font-size:30px;font-weight:700;letter-spacing:.04em;fill:#00f0ff}
.b{font-size:22px;fill:#e6f7ff}
.d{font-size:20px;fill:#8b95b8}
.s,.sm{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s{stroke:#00f0ff}
.sm{stroke:#ff2bd6}
.fm{fill:#ff2bd6}
.fc{fill:#00f0ff}
.cur{fill:#00f0ff;animation:blink 1.1s steps(1) infinite}
.ic{animation:pulse 4s ease-in-out infinite}
.fl{fill:none;stroke-width:2.5;stroke-dasharray:8 5;animation:flow 1s linear infinite}
.pulse{opacity:0;offset-path:path("M200 92H640V312H200Z");animation:run 8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes run{0%{offset-distance:0%;opacity:1}100%{offset-distance:100%;opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
