<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 306" width="840" height="306" role="img" aria-label="lab, not public yet: voice-copilot, a voice-first AI co-pilot for Linux with speech in, speech out, that drives the whole system, not just the desktop and the browser.">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}
.b{font-size:22px;fill:#e6f7ff}
.s{font-size:16px;fill:#8b95b8}
.d{font-size:20px;fill:#8b95b8}
.c{fill:#00f0ff}
.m{fill:#ff2bd6}
.ok{fill:#39ff9f}
.w{font-weight:700}
@keyframes blink{50%{opacity:0}}
.cur{fill:#00f0ff;animation:blink 1.1s steps(1) infinite}
.n{font-size:28px;letter-spacing:.02em}
.pu{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<clipPath id="clip"><rect x="10" y="10" width="820" height="286" rx="16"/></clipPath>
<filter id="haze" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="35"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="820" height="286" rx="16" fill="#0c0d1a" fill-opacity=".92"/>
<g clip-path="url(#clip)" opacity=".30" filter="url(#haze)"><circle cx="108.39999999999999" cy="52.9" r="90" fill="#00f0ff"/><circle cx="748.0" cy="281.7" r="100" fill="#ff2bd6"/></g>
<rect x="10" y="10" width="820" height="286" rx="16" fill="url(#glass)"/>
<rect x="10" y="10" width="820" height="286" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<line x1="26" y1="11.5" x2="814" y2="11.5" stroke="#fff" stroke-opacity=".25"/>
<text class="w c" font-size="22" x="44" y="62" filter="url(#glow)"><tspan class="m">&gt;</tspan> ls ~/lab</text>
<text class="d" x="796" y="62" text-anchor="end"># not public yet</text>
<g transform="translate(46,92)" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><rect x="17" y="4" width="14" height="24" rx="7"/><path d="M11 22 a13 13 0 0 0 26 0 M24 35 V44 M17 44 H31"/><path stroke="#ff2bd6" d="M3 18 V26 M8 14 V30 M40 14 V30 M45 18 V26"/></g>
<text class="w c n" x="124" y="122" filter="url(#glow)">voice-copilot/</text>
<g class="pu"><rect x="412" y="95" width="82" height="32" rx="16" fill="#ff2bd6" fill-opacity=".10" stroke="#ff2bd6" stroke-width="1.2"/><text class="m" x="453.0" y="117" font-size="18" text-anchor="middle">[wip]</text></g>
<g><rect x="504" y="95" width="127" height="32" rx="16" fill="#ff2bd6" fill-opacity=".10" stroke="#ff2bd6" stroke-width="1.2"/><text class="m" x="567.5" y="117" font-size="18" text-anchor="middle">[private]</text></g>
<text class="b" x="124" y="160">voice-first AI co-pilot for Linux: speech in,</text>
<text class="b" x="124" y="189">speech out, and it drives the whole system,</text>
<text class="b" x="124" y="218">not just the desktop and the browser.</text>
<text class="m" font-size="22" x="44" y="266" filter="url(#glow)">&gt;</text><rect class="cur" x="68" y="248" width="12" height="24"/>
</svg>
